name: Auto Trending Tweet Bot

on:
  schedule:
    - cron: "0 * * * *"   # setiap jam pada menit 0 (ubah sesuai kebutuhan)
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_SECRET: ${{ secrets.ACCESS_SECRET }}
          IMAGE_URL: ${{ secrets.IMAGE_URL }}         # URL gambar yang ingin dipost
          TWEET_TITLE: ${{ secrets.TWEET_TITLE }}     # optional
          TWEET_DESC: ${{ secrets.TWEET_DESC }}       # optional
        run: python app.py
